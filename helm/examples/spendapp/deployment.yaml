apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spendapp
  template:
    metadata:
      labels:
        app: spendapp
    spec:
      containers:
        - name: spendapp
          image: nginx:stable
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spendapp
  namespace: default
spec:
  selector:
    app: spendapp
  ports:
    - name: http
      port: 80
      targetPort: 80
