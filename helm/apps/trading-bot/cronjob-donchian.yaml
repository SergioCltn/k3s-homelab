# Donchian sleeve: Binance 4h candles close at 00:00/04:00/... UTC; run 5
# minutes later. Runs are idempotent per candle (unique decision constraint),
# so retries and missed schedules are safe. timeZone needs Kubernetes >= 1.27.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: donchian-testnet
  labels:
    app: trading-bot
spec:
  schedule: "5 */4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app: trading-bot
            sleeve: donchian
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: bot
              image: 192.168.1.243:5000/trading-bot:38c2319ce081d5eb04d8756d6f6fd10e087dd6b5
              imagePullPolicy: Always
              args:
                - live-testnet
                - --exchange
                - binance
                - --symbol
                - BTC/USDT
                - --timeframe
                - 4h
                - --limit
                - "400"
                - --strategy
                - donchian
                - --donchian-window
                - "20"
                - --donchian-exit-window
                - "5"
                - --donchian-use-trend-filter
                - --donchian-trend-ema-period
                - "250"
                - --donchian-use-atr-stop
                - --donchian-atr-period
                - "14"
                - --donchian-atr-stop-multiplier
                - "2.5"
                - --risk-per-trade
                - "0.01"
                - --paper-state
                - selected-donchian-3
                - --candle-db
                - /data/candles.sqlite3
              envFrom:
                - secretRef:
                    name: trading-bot-env
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: donchian-data
