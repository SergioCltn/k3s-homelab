apiVersion: v1
kind: Service
metadata:
  name: trading-bot-ui
  namespace: trading-bot
spec:
  type: NodePort
  selector:
    app: trading-bot-ui
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-bot-ui
  namespace: trading-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-bot-ui
  template:
    metadata:
      labels:
        app: trading-bot-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ui
          image: 192.168.1.243:5000/trading-bot:8bf8f073cbfc4d621b689d3bdfb88deedb7fd6c7
          imagePullPolicy: Always
          command:
            - streamlit
          args:
            - run
            - src/trading_bot/ui/app.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --server.headless=true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trading-bot-postgres
                  key: DATABASE_URL
            - name: PAPER_STARTING_CASH
              value: "10000"
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
