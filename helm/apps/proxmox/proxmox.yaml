apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: proxmox
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-192-168-1-45
  namespace: proxmox
  labels:
    kubernetes.io/service-name: proxmox
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.45
ports:
  - name: https
    protocol: TCP
    port: 8006
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: proxmox-selfsigned
  namespace: proxmox
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: proxmox-home-arpa
  namespace: proxmox
spec:
  secretName: proxmox-home-arpa-tls
  dnsNames:
    - proxmox.home.arpa
  issuerRef:
    name: proxmox-selfsigned
    kind: Issuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxmox
  namespace: proxmox
  annotations:
    external-dns.alpha.kubernetes.io/hostname: proxmox.home.arpa
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - proxmox.home.arpa
      secretName: proxmox-home-arpa-tls
  rules:
    - host: proxmox.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxmox
                port:
                  number: 8006
