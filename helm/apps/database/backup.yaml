apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dumpall
              image: public.ecr.aws/docker/library/postgres:16
              envFrom:
                - secretRef:
                    name: database-admin
              command:
                - sh
                - -ceu
                - |
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  mkdir -p /backups
                  timestamp=$(date +%Y%m%d-%H%M%S)
                  outfile="/backups/postgres-all-${timestamp}.sql.gz"
                  pg_dumpall -h postgres -U "$POSTGRES_USER" | gzip -9 > "$outfile"
                  find /backups -type f -name 'postgres-all-*.sql.gz' -mtime +14 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
