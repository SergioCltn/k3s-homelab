apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-bot-dashboard
  namespace: trading-bot-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-bot-dashboard
  template:
    metadata:
      labels:
        app: trading-bot-dashboard
    spec:
      serviceAccountName: trading-bot-dashboard
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dashboard
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/dashboard.py
          env:
            - name: WATCH_NAMESPACE
              value: trading-bot
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: trading-bot-dashboard
