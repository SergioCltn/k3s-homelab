apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-bot-dashboard
  namespace: trading-bot-dashboard
  annotations:
    external-dns.alpha.kubernetes.io/hostname: trading-bot-dashboard.home.arpa
spec:
  ingressClassName: nginx
  rules:
    - host: trading-bot-dashboard.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-bot-dashboard
                port:
                  number: 8080
