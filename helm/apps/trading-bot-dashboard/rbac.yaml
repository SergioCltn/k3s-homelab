apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-bot-dashboard
  namespace: trading-bot-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trading-bot-dashboard-reader
  namespace: trading-bot
rules:
  - apiGroups: [""]
    resources: ["events", "persistentvolumeclaims", "pods", "pods/log", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trading-bot-dashboard-reader
  namespace: trading-bot
subjects:
  - kind: ServiceAccount
    name: trading-bot-dashboard
    namespace: trading-bot-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trading-bot-dashboard-reader
