apiVersion: v1
kind: Service
metadata:
  name: spend-app-postgres
  namespace: spend-app
spec:
  selector:
    app: spend-app-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spend-app-postgres-data
  namespace: spend-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spend-app-postgres
  namespace: spend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spend-app-postgres
  template:
    metadata:
      labels:
        app: spend-app-postgres
    spec:
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: spend-app-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spend-app-postgres-data
