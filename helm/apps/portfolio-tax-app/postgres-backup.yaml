apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-tax-app-postgres-backups
  namespace: portfolio-tax-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: portfolio-tax-app-postgres-backup
  namespace: portfolio-tax-app
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: public.ecr.aws/docker/library/postgres:16
              envFrom:
                - secretRef:
                    name: portfolio-tax-app-postgres
              command:
                - sh
                - -ceu
                - |
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  mkdir -p /backups
                  timestamp=$(date +%Y%m%d-%H%M%S)
                  outfile="/backups/portfolio-tax-app-${timestamp}.sql.gz"
                  pg_dump -h portfolio-tax-app-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip -9 > "$outfile"
                  find /backups -type f -name 'portfolio-tax-app-*.sql.gz' -mtime +7 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: portfolio-tax-app-postgres-backups
