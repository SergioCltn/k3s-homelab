apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-tax-app-frontend
  namespace: portfolio-tax-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-tax-app-frontend
  template:
    metadata:
      labels:
        app: portfolio-tax-app-frontend
    spec:
      containers:
        - name: frontend
          image: 192.168.1.243:5000/portfolio-tax-app-frontend:dd1827ccbd360c5c9cffb4cda6eb508d9fccf906
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-tax-app-frontend
  namespace: portfolio-tax-app
spec:
  selector:
    app: portfolio-tax-app-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
