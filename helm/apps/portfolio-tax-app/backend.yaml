apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-tax-app-backend
  namespace: portfolio-tax-app
data:
  HTTP_ADDR: ":8080"
  CORS_ALLOWED_ORIGIN: "http://portfolio.home.arpa"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-tax-app-backend
  namespace: portfolio-tax-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-tax-app-backend
  template:
    metadata:
      labels:
        app: portfolio-tax-app-backend
    spec:
      containers:
        - name: backend
          image: 192.168.1.243:5000/portfolio-tax-app-backend:7b9bf27a52786adecc6bbd80a2cb0f577c809e4e
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: portfolio-tax-app-backend
            - secretRef:
                name: portfolio-tax-app-backend
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-tax-app-backend
  namespace: portfolio-tax-app
spec:
  selector:
    app: portfolio-tax-app-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
