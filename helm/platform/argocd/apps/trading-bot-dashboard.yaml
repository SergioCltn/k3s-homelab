apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-bot-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/sergiocltn/k3s.git
    targetRevision: main
    path: helm/apps/trading-bot-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: trading-bot-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
