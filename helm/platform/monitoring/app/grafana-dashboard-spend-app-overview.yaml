              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.1.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "max(kube_pod_container_status_ready{namespace=\"database\",pod=~\"postgres-.*\",container=\"postgres\"})",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Shared Postgres Ready",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
              "uid": "prometheus"
