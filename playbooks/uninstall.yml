- name: Uninstall k3s agents
  hosts: k3s_agents
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/k3s.yml

  pre_tasks:
    - name: Refuse agent uninstall unless explicitly confirmed
      ansible.builtin.assert:
        that:
          - confirm_uninstall | default(false) | bool
          - confirm_target | default('') == inventory_hostname
        fail_msg: >-
          Refusing to uninstall k3s agent on {{ inventory_hostname }}. Re-run with
          -e confirm_uninstall=true -e confirm_target={{ inventory_hostname }}

  tasks:
    - name: Check whether k3s agent uninstall script exists
      stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: k3s_agent_uninstall

    - name: Run k3s agent uninstall script
      command: /usr/local/bin/k3s-agent-uninstall.sh
      when: k3s_agent_uninstall.stat.exists

    - name: Remove agent node from cluster
      command: >-
        k3s kubectl delete node
        {{ k3s_node_name | default(inventory_hostname) }}
        --ignore-not-found
      delegate_to: "{{ k3s_primary_server }}"
      register: k3s_delete_agent_node
      changed_when: "'deleted' in k3s_delete_agent_node.stdout"
      failed_when: false

    - name: Verify agent service is removed
      command: systemctl status k3s-agent
      register: k3s_agent_status
      changed_when: false
      failed_when: false

    - name: Show uninstall result
      debug:
        msg: "k3s-agent.service status rc={{ k3s_agent_status.rc }}"

- name: Uninstall k3s servers
  hosts: k3s_servers
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/k3s.yml

  pre_tasks:
    - name: Refuse server uninstall unless explicitly confirmed
      ansible.builtin.assert:
        that:
          - confirm_uninstall | default(false) | bool
          - confirm_target | default('') == inventory_hostname
        fail_msg: >-
          Refusing to uninstall k3s server on {{ inventory_hostname }}. Re-run with
          -e confirm_uninstall=true -e confirm_target={{ inventory_hostname }}

  tasks:
    - name: Check whether uninstall script exists
      stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: k3s_uninstall

    - name: Run k3s uninstall script
      command: /usr/local/bin/k3s-uninstall.sh
      when: k3s_uninstall.stat.exists

    - name: Verify service is removed
      command: systemctl status k3s
      register: k3s_status
      changed_when: false
      failed_when: false

    - name: Show uninstall result
      debug:
        msg: "k3s.service status rc={{ k3s_status.rc }}"
