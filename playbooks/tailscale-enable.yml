- name: Enable an already-authenticated Tailscale node
  hosts: k3s_servers
  gather_facts: false
  become: true

  tasks:
    - name: Check passwordless sudo
      command: sudo -n true
      changed_when: false

    - name: Start and enable tailscaled
      systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Ensure Tailscale is running
      command: tailscale up
      changed_when: false

    - name: Show Tailscale status
      command: tailscale status
      register: tailscale_status
      changed_when: false

    - name: Print status
      debug:
        msg: "{{ tailscale_status.stdout_lines }}"
