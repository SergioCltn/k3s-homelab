- name: Install and configure Tailscale subnet router
  hosts: k3s_servers
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/k3s.yml
  vars:
    tailscale_routes_arg: "{{ tailscale_advertise_routes | join(',') }}"
    tailscale_up_args:
      - --auth-key={{ tailscale_auth_key }}
      - --advertise-routes={{ tailscale_routes_arg }}
      - --accept-dns={{ 'true' if tailscale_accept_dns | bool else 'false' }}
      - "{{ '--ssh' if tailscale_ssh | bool else '--ssh=false' }}"

  pre_tasks:
    - name: Require a Tailscale auth key
      assert:
        that:
          - tailscale_auth_key is defined
          - tailscale_auth_key | length > 0
        fail_msg: >-
          Pass a Tailscale auth key with -e tailscale_auth_key=tskey-auth-...
          Do not commit auth keys to this repository.

  tasks:
    - name: Check passwordless sudo
      command: sudo -n true
      changed_when: false

    - name: Install HTTPS apt prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        lock_timeout: 600

    - name: Ensure Tailscale apt keyring directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: Install Tailscale apt key
      get_url:
        url: https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Install Tailscale apt source
      get_url:
        url: https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"
      register: tailscale_apt_source

    - name: Install Tailscale package
      apt:
        name: tailscale
        state: present
        update_cache: "{{ tailscale_apt_source.changed }}"
        lock_timeout: 600

    - name: Enable IPv4 forwarding for subnet routing
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Enable IPv6 forwarding for subnet routing
      sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        state: present
        reload: true

    - name: Enable and start tailscaled
      systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check Tailscale status
      command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Record Tailscale backend state
      set_fact:
        tailscale_backend_state: >-
          {{ (tailscale_status.stdout | from_json).BackendState
             if tailscale_status.rc == 0 and tailscale_status.stdout | length > 0
             else 'Stopped' }}

    - name: Bring up Tailscale subnet router
      command: tailscale up {{ tailscale_up_args | join(' ') }}
      no_log: true
      when: tailscale_backend_state != 'Running'

    - name: Show approval reminder
      debug:
        msg:
          - "Tailscale is installed on {{ inventory_hostname }}."
          - "Approve advertised route {{ tailscale_routes_arg }} in the Tailscale admin console if it is not already approved."
